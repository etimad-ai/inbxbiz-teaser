name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kimi-onboarding/package-lock.json

      - name: Build registration app
        working-directory: kimi-onboarding
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site/register
          cp index.html _site/
          cp -r assets _site/
          cp -r kimi-onboarding/dist/. _site/register/
          [ ! -f CNAME ] || cp CNAME _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
